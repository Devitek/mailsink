# Mailsink with Docker Compose (#18). Pick one profile:
#   docker compose -f docker/docker-compose.yml --profile pglite up -d     # embedded PGlite
#   docker compose -f docker/docker-compose.yml --profile postgres up -d   # PostgreSQL 18
# Image: ghcr.io/devitek/mailsink:latest by default (#45); MAILSINK_IMAGE picks another tag
# (ghcr.io/devitek/mailsink:0.1). Compose pulls it, and builds it from this checkout only
# when the pull fails. To run your own build of the checkout instead:
#   MAILSINK_IMAGE=mailsink:local docker compose -f docker/docker-compose.yml \
#     --profile pglite up -d --build
# Host ports: MAILSINK_HTTP_PORT (default 3000) and MAILSINK_SMTP_HOST_PORT (default 1025).
# MAILSINK_ADMIN_KEY protects the Admin API; unset, every Admin API call is refused.
# SMTP credentials and snippets give MAILSINK_SMTP_HOST_PORT as the port (D66), and
# MAILSINK_SMTP_PUBLIC_HOST as the host when set (else the hostname of MAILSINK_PUBLIC_URL).
# STARTTLS (optional): MAILSINK_SMTP_TLS_DIR is a host directory holding the PEM files,
# mounted read-only on /app/tls (relative paths start from this docker/ directory), and
# MAILSINK_SMTP_TLS_CERT / MAILSINK_SMTP_TLS_KEY name the files inside the container:
#   MAILSINK_SMTP_TLS_DIR=./certs MAILSINK_SMTP_TLS_CERT=/app/tls/cert.pem \
#   MAILSINK_SMTP_TLS_KEY=/app/tls/key.pem docker compose -f docker/docker-compose.yml ...
# Unset, an empty volume is mounted instead and STARTTLS stays off.

x-mailsink: &mailsink
  image: ${MAILSINK_IMAGE:-ghcr.io/devitek/mailsink:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  ports:
    - "${MAILSINK_HTTP_PORT:-3000}:3000"
    - "${MAILSINK_SMTP_HOST_PORT:-1025}:1025"

# Shared by both profiles: what clients reach, not what the container binds (D66).
x-public-env: &public-env
  MAILSINK_ADMIN_KEY: ${MAILSINK_ADMIN_KEY:-}
  MAILSINK_PUBLIC_URL: ${MAILSINK_PUBLIC_URL:-http://localhost:${MAILSINK_HTTP_PORT:-3000}}
  MAILSINK_SMTP_PUBLIC_HOST: ${MAILSINK_SMTP_PUBLIC_HOST:-}
  MAILSINK_SMTP_PUBLIC_PORT: ${MAILSINK_SMTP_HOST_PORT:-1025}

# STARTTLS certificate and key, both or neither (empty means unset).
x-tls-env: &tls-env
  MAILSINK_SMTP_TLS_CERT: ${MAILSINK_SMTP_TLS_CERT:-}
  MAILSINK_SMTP_TLS_KEY: ${MAILSINK_SMTP_TLS_KEY:-}

services:
  # Embedded PGlite: the database lives in the `pglite-data` volume, nothing else to run.
  mailsink:
    <<: *mailsink
    profiles: [pglite]
    environment:
      <<: [*public-env, *tls-env]
      DATABASE_URL: pglite:///app/data
    volumes:
      - pglite-data:/app/data
      - ${MAILSINK_SMTP_TLS_DIR:-mailsink-tls}:/app/tls:ro

  # PostgreSQL: Mailsink waits for the server, then applies its migrations at boot.
  mailsink-postgres:
    <<: *mailsink
    profiles: [postgres]
    environment:
      <<: [*public-env, *tls-env]
      DATABASE_URL: postgres://mailsink:${POSTGRES_PASSWORD:-mailsink}@postgres:5432/mailsink
    volumes:
      - ${MAILSINK_SMTP_TLS_DIR:-mailsink-tls}:/app/tls:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailsink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailsink}
      POSTGRES_DB: mailsink
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailsink -d mailsink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pglite-data:
  postgres-data:
  # Empty stand-in for /app/tls when MAILSINK_SMTP_TLS_DIR is unset.
  mailsink-tls:
