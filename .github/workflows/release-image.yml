name: release-image

# Publishes ghcr.io/devitek/mailsink for a release tag (#45): linux/amd64 and linux/arm64,
# tags X.Y.Z, X.Y and latest, OCI labels and index annotations, provenance and SBOM
# attestations. Called by release-please.yml once a release is created; run it by hand
# (Actions > release-image > Run workflow) to publish an existing tag again.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/devitek/mailsink
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # The image reads its version from the root package.json (D181): it must match the tag.
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$TAG" || { echo "package.json is ${version}, tag is ${TAG}" >&2; exit 1; }
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # context: git reads the revision from the checked-out tag, not from the triggering
      # commit (they differ on a manual run).
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          context: git
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Mailsink
            org.opencontainers.image.description=Every email caught. None delivered. The sandbox for your transactional email.
          annotations: |
            org.opencontainers.image.title=Mailsink
            org.opencontainers.image.description=Every email caught. None delivered. The sandbox for your transactional email.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=mailsink-release
          cache-to: type=gha,scope=mailsink-release,mode=max
          provenance: mode=max
          sbom: true
