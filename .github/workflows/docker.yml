name: docker

# Builds the image and smoke-tests it through docker/docker-compose.yml (#18). Publishing to
# GHCR is a separate concern (#45).
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      MAILSINK_IMAGE: mailsink:ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f docker/Dockerfile -t "$MAILSINK_IMAGE" .
      - name: Smoke test (PGlite and Postgres profiles)
        run: docker/smoke-test.sh pglite postgres
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id "$MAILSINK_IMAGE" -u)" != 0
