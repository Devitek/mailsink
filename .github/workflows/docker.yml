name: docker

# Builds the image and smoke-tests it through docker/docker-compose.yml (#18). Nothing is
# pushed from here: releases publish to GHCR through release-please.yml and
# release-image.yml (#45).
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      MAILSINK_IMAGE: mailsink:ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # Layers cached in the GitHub Actions cache (mode=max keeps the deps and build stages
      # too, so a source-only change reuses the pnpm store layer). `load` puts the image in
      # the local daemon for the smoke test.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ env.MAILSINK_IMAGE }}
          load: true
          cache-from: type=gha,scope=mailsink-image
          cache-to: type=gha,scope=mailsink-image,mode=max
      - name: Smoke test (PGlite and Postgres profiles)
        run: docker/smoke-test.sh pglite postgres
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id "$MAILSINK_IMAGE" -u)" != 0
