name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # DB tests run on both drivers: this service backs the Postgres side (PGlite needs none).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mailsink
          POSTGRES_PASSWORD: mailsink
          POSTGRES_DB: mailsink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailsink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mailsink:mailsink@localhost:5432/mailsink_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Fails when FR/EN catalogs are out of sync with the code or have a missing entry.
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm test
      # Builds every package with a build script: the app and the standalone CLI bin.
      - run: pnpm build
      # The bundled bin must run on its own and apply the migrations it ships.
      - run: node packages/cli/dist/bin.mjs migrate --database-url pglite://memory
      # The e2e job serves this build instead of building the app again. The Nitro output is
      # self-contained (traced node_modules, migrations) and has no symlink. The folder name
      # starts with a dot: upload-artifact skips hidden paths unless include-hidden-files is set.
      - uses: actions/upload-artifact@v7
        with:
          name: app-output
          path: apps/mailsink/.output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @mailsink/app exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Browser binaries are cached per Playwright version; their system libraries are not.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @mailsink/app exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @mailsink/app exec playwright install-deps chromium
      # Scenarios run against the production build of the check job
      # (`node .output/server/index.mjs`); the fallback suite still builds its own variant.
      - uses: actions/download-artifact@v8
        with:
          name: app-output
          path: apps/mailsink/.output/
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/mailsink/playwright-report/
            apps/mailsink/test-results/
          retention-days: 14
