name: release-please

# Releases from Conventional Commits (#45). Every push to main updates one release PR
# (version bump of the root package.json and of the npm packages, CHANGELOG.md). Merging
# that PR tags vX.Y.Z, creates the GitHub release, then publishes the image to GHCR
# (release-image.yml), the npm packages (release-npm.yml, #128) and attaches openapi.json
# to the release (release-openapi.yml). These jobs are chained here rather than triggered
# by the tag or the release: events created with GITHUB_TOKEN start no other workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # npm trusted publishing validates this file (the caller), not release-npm.yml: each
  # package trusts release-please.yml and release-npm.yml (CONTRIBUTING.md, Releasing).
  npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  openapi:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-openapi.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
