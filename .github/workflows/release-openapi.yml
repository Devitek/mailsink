name: release-openapi

# Attaches openapi.json, the OpenAPI 3.1 document of the release (`pnpm openapi`, D234), to
# the GitHub release of a tag (#128). Called by release-please.yml once a release is
# created; run it by hand (Actions > release-openapi > Run workflow) to attach it to an
# existing release again (the asset is replaced).
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-openapi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # info.version comes from the root package.json: it must be the tag.
      - name: Generate openapi.json
        run: |
          pnpm openapi "$RUNNER_TEMP/openapi.json"
          version="$(node -p "require(process.argv[1]).info.version" "$RUNNER_TEMP/openapi.json")"
          test "v${version}" = "$TAG" || { echo "openapi.json is ${version}, tag is ${TAG}" >&2; exit 1; }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/openapi.json" --clobber
