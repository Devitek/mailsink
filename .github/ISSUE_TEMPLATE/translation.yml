name: Translation
description: Add a language or fix a translation of the web UI
title: "i18n: "
labels: ["type:feature", "area:i18n"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Read [the translation guide](../blob/main/docs/contributing/translations.md) first.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Add a new language
        - Fix an existing translation
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Locale code (BCP 47)
      placeholder: de, pt-BR…
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For a fix, the screen and the current and proposed text.
