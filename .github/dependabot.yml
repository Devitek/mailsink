version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      lingui:
        patterns: ["@lingui/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images of docker/Dockerfile and docker/docker-compose.yml (#18).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
